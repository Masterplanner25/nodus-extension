[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodus-extension"
version = "0.1.0"
description = "Typed, versioned, sandboxed extension framework for Nodus agents"
authors = [{ name = "Shawn Knight" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "nodus-lang>=4.0.0,<5.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
nodus-extension = "nodus_extension.__main__:main"

[project.entry-points."nodus.nd"]
nodus-extension = "nodus_extension.nd.nd:get_nd_root"

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-extension"
Repository = "https://github.com/Masterplanner25/nodus-extension"
Changelog = "https://github.com/Masterplanner25/nodus-extension/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/nodus_extension"]
artifacts = ["src/nodus_extension/nd/*.nd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["nodus_extension"]

[tool.coverage.report]
fail_under = 75
omit = ["*/nodus_extension/__main__.py"]
